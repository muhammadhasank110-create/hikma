    <!-- Skip link styles (must be in <head> to avoid FOUC) -->
    <style>
      .skip-link {
        position: absolute;
        top: -100%;
        left: 0;
        z-index: 9999;
        padding: 0.75rem 1.5rem;
        background: #1E4620;
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        border-radius: 0 0 0.5rem 0;
        transition: top 0.15s;
      }
      .skip-link:focus {
        top: 0;
      }
    </style>
