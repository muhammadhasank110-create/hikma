<!doctype html>
<html lang="en" dir="ltr" data-theme="light" data-font="atkinson">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2" />
    <meta name="description" content="Hikma — حكمة | Adaptive AI Learning Platform for every learner" />
    <title>Hikma — حكمة</title>
    <!-- Accessibility: preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Atkinson Hyperlegible — default body font (dyslexia-friendly) -->
    <!-- IBM Plex Sans — secondary option -->
    <!-- Amiri — Arabic display font -->
    <!-- Noto Naskh Arabic — Arabic body font -->
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- OpenDyslexic via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.min.css" />
    <!-- Skip link styles (must be in <head> to avoid FOUC) -->
    <style>
      .skip-link {
        position: absolute;
        top: -100%;
        left: 0;
        z-index: 9999;
        padding: 0.75rem 1.5rem;
        background: #1E4620;
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        border-radius: 0 0 0.5rem 0;
        transition: top 0.15s;
      }
      .skip-link:focus {
        top: 0;
      }
    </style>
  </head>
  <body>
    <!-- Skip navigation links — §4.3 -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <a href="#ai-tutor" class="skip-link">Skip to AI tutor</a>
    <a href="#accessibility-bar" class="skip-link">Skip to accessibility controls</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%">
    </script>
  </body>
</html>
